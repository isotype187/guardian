name: Guardian Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Guardian Test Suite
    runs-on: windows-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
      
      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: 'latest'
      
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -MinimumVersion 6.0.0 -Scope CurrentUser
          Import-Module Pester
      
      - name: Run Foundation Tests (M0)
        shell: pwsh
        working-directory: Nexus98_Guardian
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          Invoke-Pester -Path .\tests\Guardian.Foundation.Tests.ps1 -Output Detailed -PassThru
      
      - name: Run M10 Tests (Continuous Operations)
        shell: pwsh
        working-directory: Nexus98_Guardian
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          Invoke-Pester -Path .\tests\Guardian.M10.Tests.ps1 -Output Detailed -PassThru
        continue-on-error: false
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            Nexus98_Guardian/data/ops/*.json
            Nexus98_Guardian/logs/*.jsonl
          retention-days: 7

  test-all:
    name: Full Test Suite (Milestones M0-M10)
    runs-on: windows-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
      
      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: 'latest'
      
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -MinimumVersion 6.0.0 -Scope CurrentUser
          Import-Module Pester
      
      - name: Run Full Test Suite
        shell: pwsh
        working-directory: Nexus98_Guardian
        run: |
          .\scripts\Run-GuardianTests.ps1 -VerboseOutput
        continue-on-error: true
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results
          path: |
            Nexus98_Guardian/data/ops/*.json
            Nexus98_Guardian/logs/*.jsonl
          retention-days: 7