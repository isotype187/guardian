name: Guardian CI Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

permissions:
  contents: read
  actions: read
  security-events: write
  checks: write

env:
  GUARDIAN_ROOT: ${{ github.workspace }}/Nexus98_Guardian
  PS_VERSION: '7.4'

jobs:
  # ============================================================
  # STAGE 1: SYNTAX CHECK
  # ============================================================
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: ${{ env.PS_VERSION }}

      - name: Validate Module Syntax
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          $modules = Get-ChildItem ./core/Guardian_*.ps1
          Write-Host "Found $($modules.Count) modules to validate"
          $failed = 0
          foreach ($module in $modules) {
            try {
              Import-Module $module.FullName -ErrorAction Stop
              Write-Host "✅ $($module.Name)" -ForegroundColor Green
            }
            catch {
              Write-Error "❌ $($module.Name): $($_.Exception.Message)"
              $failed++
            }
          }
          if ($failed -gt 0) {
            throw "$failed module(s) failed syntax validation"
          }
          Write-Host "✅ All $($modules.Count) modules loaded successfully" -ForegroundColor Green

  # ============================================================
  # STAGE 2: UNIT TESTS (Matrix: OS x Milestone)
  # ============================================================
  unit-tests:
    name: Unit Tests (${{ matrix.milestone }})
    needs: syntax-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        milestone: [Foundation, M2, M3, M4, M5, M6, M7, M8, M9, M10]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: ${{ env.PS_VERSION }}

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -MinimumVersion 6.0.0 -Scope CurrentUser -ErrorAction Stop
          Import-Module Pester

      - name: Run Unit Tests
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          
          $testFile = "Guardian.${{ matrix.milestone }}.Tests.ps1"
          if ($testFile -eq "Guardian.Foundation.Tests.ps1") { $testFile = "Guardian.Foundation.Tests.ps1" }
          $path = ".\tests\$testFile"
          
          if (-not (Test-Path $path)) {
            Write-Warning "Test file not found: $path - skipping"
            exit 0
          }
          
          $result = Invoke-Pester -Path $path -Tag Unit -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Unit tests failed for ${{ matrix.milestone }} on ${{ matrix.os }}"
          }
          Write-Host "✅ ${{ matrix.milestone }} unit tests passed on ${{ matrix.os }}"

  # ============================================================
  # STAGE 3: INTEGRATION TESTS
  # ============================================================
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: ${{ env.PS_VERSION }}

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -MinimumVersion 6.0.0 -Scope CurrentUser -ErrorAction Stop
          Import-Module Pester

      - name: Create Safety Checkpoint
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          $cp = New-GuardianCheckpoint -Tier Emergency -Label "CI-Integration-${{ github.run_id }}"
          Write-Host "CHECKPOINT_ID=$($cp.CheckpointId)" >> $env:GITHUB_ENV

      - name: Run Integration Tests
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          $result = Invoke-Pester -Path .\tests\ -Tag Integration -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Integration tests failed"
          }
          Write-Host "✅ All integration tests passed"

      - name: Restore Checkpoint
        if: always()
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          if ($env:CHECKPOINT_ID) {
            . .\core\Guardian_Loader.ps1
            Import-Guardian -Root (Resolve-Path .)
            $cp = Get-GuardianCheckpoint -Id $env:CHECKPOINT_ID
            if ($cp) {
              Restore-GuardianCheckpoint -Checkpoint $cp -Confirm:$false
              Write-Host "✅ Checkpoint restored successfully"
            }
          }

  # ============================================================
  # STAGE 4: ARCHITECTURE DRIFT CHECK
  # ============================================================
  architecture-drift:
    name: Architecture Drift Check
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: ${{ env.PS_VERSION }}

      - name: Check Architecture Drift
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          $drift = Test-GuardianArchitectureDrift
          if ($drift.Count -gt 0) {
            Write-Error "Architecture drift detected:"
            $drift | Format-Table type, path, severity -AutoSize
            exit 1
          }
          Write-Host "✅ No architecture drift detected" -ForegroundColor Green

  # ============================================================
  # STAGE 5: POLICY COMPLIANCE
  # ============================================================
  policy-compliance:
    name: Policy Compliance Check
    needs: architecture-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: ${{ env.PS_VERSION }}

      - name: Check Policy Compliance
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          
          # Get all public mutation functions
          $functions = Get-Command -Module Guardian_* -CommandType Function |
            Where-Object { $_.Name -match '^(Set|New|Remove|Invoke|Update|Start|Stop|Enable|Disable|Restore|Register|Unregister)-' }
          
          $failures = 0
          foreach ($fn in $functions) {
            try {
              $policy = Test-GuardianPolicy -ActionDescription $fn.Name -RiskLevel 'medium' -CheckpointAvailable $true
              if ($policy.decision -in @('BLOCK', 'DENY')) {
                Write-Error "Policy BLOCK on $($fn.Name): $($policy.reason)"
                $failures++
              }
              elseif ($policy.decision -eq 'REQUIRE_CHECKPOINT') {
                Write-Warning "Policy requires checkpoint for $($fn.Name): $($policy.reason)"
              }
            }
            catch {
              Write-Warning "Policy check skipped for $($fn.Name): $($_.Exception.Message)"
            }
          }
          
          if ($failures -gt 0) {
            throw "$failures policy compliance failures detected"
          }
          Write-Host "✅ All mutation functions pass policy compliance" -ForegroundColor Green

  # ============================================================
  # STAGE 6: CONTRACT TESTING (M11+)
  # ============================================================
  contract-testing:
    name: Contract Testing
    needs: policy-compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JSON Schema Validator
        run: pip install jsonschema

      - name: Generate/Validate JSON Schemas
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          
          $schemaDir = "docs/schemas/bridge-messages"
          if (-not (Test-Path $schemaDir)) { 
            New-Item -ItemType Directory -Force -Path $schemaDir | Out-Null 
          }
          
          if (Test-Path "$schemaDir/*.json") {
            Get-ChildItem "$schemaDir/*.json" | ForEach-Object {
              Write-Host "Found schema: $($_.Name)"
              # Validate sample messages against schema
              # python -m jsonschema -i sample.json "$($_.FullName)"
            }
          }
          else {
            Write-Warning "No bridge message schemas found - schemas will be created as part of M11"
          }

  # ============================================================
  # STAGE 7: SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    needs: policy-compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path ./core -Severity Warning -ErrorAction SilentlyContinue
          if ($results) {
            $results | Format-Table RuleName, Severity, Line, Message -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors.Count -gt 0) {
              throw "$($errors.Count) PSScriptAnalyzer errors found"
            }
          }
          Write-Host "✅ PSScriptAnalyzer passed" -ForegroundColor Green

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          path: ${{ env.GUARDIAN_ROOT }}
          config: .gitleaks.toml
          verbose: true

      - name: Dependency Vulnerability Scan
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter "*.csproj" -ErrorAction SilentlyContinue
          if ($projects) {
            foreach ($proj in $projects) {
              dotnet list "$($proj.FullName)" package --vulnerable --include-transitive
            }
          }
          else {
            Write-Host "No .NET projects found - skipping dependency scan" -ForegroundColor Yellow
          }

  # ============================================================
  # STAGE 8: DOCUMENTATION SYNC CHECK
  # ============================================================
  documentation-sync:
    name: Documentation Sync Check
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Validate Documentation Links
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          # Check for broken internal wiki-links
          $files = Get-ChildItem -Path ./Knowledge -Recurse -Filter "*.md" -File
          $brokenLinks = 0
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            $links = [regex]::Matches($content, '\[\[([^\]]+)\]\]')
            foreach ($link in $links) {
              $target = $link.Groups[1].Value
              # Check if target document exists (simplified check)
              # In production, this would resolve the actual path
            }
          }
          Write-Host "✅ Documentation link check completed" -ForegroundColor Green

      - name: Validate Frontmatter
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          $files = Get-ChildItem -Path ./Knowledge -Recurse -Filter "*.md" -File
          $missingFrontmatter = 0
          foreach ($file in $files) {
            $content = Get-Content $file.FullName -Raw
            if (-not $content.StartsWith('---')) {
              Write-Warning "Missing frontmatter: $($file.FullName)"
              $missingFrontmatter++
            }
          }
          if ($missingFrontmatter -gt 0) {
            Write-Warning "$missingFrontmatter files missing frontmatter"
          }
          else {
            Write-Host "✅ All documents have frontmatter" -ForegroundColor Green
          }

  # ============================================================
  # STAGE 9: NIGHTLY PERFORMANCE BENCHMARKS
  # ============================================================
  nightly-benchmarks:
    name: Nightly Performance Benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: ${{ env.PS_VERSION }}

      - name: Run Benchmarks
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          
          $baselinePath = "data/benchmarks/baseline.json"
          if (-not (Test-Path $baselinePath)) {
            $baseline = @{
              checkpoint_create_ms = 15000
              checkpoint_restore_ms = 45000
              event_write_ms_per_1000 = 500
              storage_scan_100k_ms = 300000
              policy_eval_ms = 5
              bridge_dispatch_ms = 2000
              timestamp = (Get-Date).ToString('o')
            }
            $baseline | ConvertTo-Json -Depth 3 | Set-Content $baselinePath -Encoding UTF8
            Write-Host "Created initial baseline"
          }
          else {
            Write-Host "Baseline exists - would compare current performance against baseline"
            $baseline = Get-Content $baselinePath | ConvertFrom-Json
            Write-Host "Current baseline: $($baseline.checkpoint_create_ms)ms checkpoint create, $($baseline.checkpoint_restore_ms)ms restore"
          }

  # ============================================================
  # STAGE 10: RELEASE PIPELINE (Manual trigger on tags)
  # ============================================================
  release:
    name: Release Build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: 
      - syntax-check
      - unit-tests
      - integration-tests
      - architecture-drift
      - policy-compliance
      - contract-testing
      - security-scan
      - documentation-sync
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Nexus98_Guardian
          fetch-depth: 0

      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          version: ${{ env.PS_VERSION }}

      - name: Extract Version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create Milestone Checkpoint
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          $cp = New-GuardianCheckpoint -Tier Milestone -Label "Release v$env:VERSION"
          Write-Host "CHECKPOINT_ID=$($cp.CheckpointId)" >> $env:GITHUB_ENV

      - name: Verify Checkpoint Integrity
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          $result = Test-GuardianCheckpointIntegrity -CheckpointId $env:CHECKPOINT_ID
          if (-not $result) { throw "Checkpoint integrity verification failed" }
          Write-Host "✅ Checkpoint integrity verified"

      - name: Generate Release Notes
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          . .\core\Guardian_Loader.ps1
          Import-Guardian -Root (Resolve-Path .)
          # Generate release notes using Scribe
          $notes = Get-GuardianReleaseNotes -Version $env:VERSION
          $notes | Out-File "dist/RELEASE_v$env:VERSION.md" -Encoding UTF8

      - name: Create Distribution Package
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          Compress-Archive -Path ./core/*.ps1, ./core/*.psd1, ./core/*.psm1, ./scripts/*.ps1 -DestinationPath "dist/Guardian-$env:VERSION.zip" -Force

      - name: Generate SBOM
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          # Generate basic SBOM
          $sbom = @{
            name = "Guardian"
            version = $env:VERSION
            timestamp = (Get-Date).ToString('o')
            components = @(
              @{ name = "PowerShell"; version = "7.4+"; type = "runtime" }
              @{ name = "Pester"; version = "6.x"; type = "test-framework" }
            )
          }
          $sbom | ConvertTo-Json -Depth 5 | Set-Content "dist/sbom-v$env:VERSION.json" -Encoding UTF8

      - name: Generate Checksums
        shell: pwsh
        working-directory: ${{ env.GUARDIAN_ROOT }}
        run: |
          $files = Get-ChildItem dist/*.zip, dist/*.json -ErrorAction SilentlyContinue
          $sums = @()
          foreach ($file in $files) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            $sums += "$($hash.Hash)  $($file.Name)"
          }
          $sums -join "`n" | Set-Content dist/SHA256SUMS -Encoding UTF8

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: "Guardian v${{ env.VERSION }}"
          body_path: dist/RELEASE_v${{ env.VERSION }}.md
          files: |
            dist/Guardian-${{ env.VERSION }}.zip
            dist/sbom-v${{ env.VERSION }}.json
            dist/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}